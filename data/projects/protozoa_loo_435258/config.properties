# Leave-one-out variant of the project protozoa: the same genomes except Leishmania infantum JPCM5 (435258),
# which taxids.txt excludes with a leading '-'. Its reads are simulated from the full
# protozoa project (run_tests.sh with FASTA=/data/projects/protozoa/fasta).
#
# allButExcluded: the excluded genome neither enters the database nor takes part in the
# least common ancestor update, so no k-mer is raised because of it. With the default 'all'
# its contigs from the RefSeq release would still push the k-mers it shares with its
# relatives up to their common ancestor, and the database would know the left-out genome
# indirectly.
refseq.updateScope=allButExcluded
# Stop at once on a key or value this Genestrip does not know, instead of building a
# database with the default in effect (see Project#checkConfigProperties in Genestrip).
strictConfigCheck=true
#refseq.assemblyAccessionsOnly=true
genomeNodes=true
svgKmerNodeIndentFactor=500
svgShowRank=true
